<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Product Showcase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }

        header {
            background: #1d4ed8;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        header h1 {
            margin-top: 0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .panel {
            background: white;
            padding: 22px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #00000012;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            padding: 11px 16px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.88;
        }

        .edit-button {
            background: #0f766e;
            margin-right: 8px;
        }

        .delete-button {
            background: #dc2626;
        }

        .cancel-button {
            background: #64748b;
            margin-left: 8px;
        }

        .product-card {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 9px;
        }

        .product-card h3 {
            color: #1d4ed8;
            margin-top: 0;
        }

        .price {
            font-weight: bold;
            color: #15803d;
        }

        #message {
            padding: 10px 0;
            font-weight: bold;
        }

        .empty-message {
            color: #64748b;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #64748b;
        }
    </style>

    <script src="app.js" defer></script>
</head>

<body>

    <header>
        <h1>Tech Product Showcase</h1>
        <p>Discover, manage, and explore technology products.</p>
    </header>

    <main class="container">

        <!-- ADD AND EDIT PRODUCT FORM -->
        <section class="panel">
            <h2 id="formTitle">Add a New Product</h2>

            <form id="productForm">

                <label for="product_name">Product Name</label>
                <input
                    type="text"
                    id="product_name"
                    placeholder="e.g. Gaming Laptop"
                    required
                >

                <label for="brand">Brand</label>
                <input
                    type="text"
                    id="brand"
                    placeholder="e.g. Lenovo"
                    required
                >

                <label for="category">Category</label>
                <input
                    type="text"
                    id="category"
                    placeholder="e.g. Computers"
                    required
                >

                <label for="price">Price</label>
                <input
                    type="number"
                    id="price"
                    min="0"
                    step="0.01"
                    placeholder="Enter price"
                    required
                >

                <label for="stock_quantity">Stock Quantity</label>
                <input
                    type="number"
                    id="stock_quantity"
                    min="0"
                    step="1"
                    placeholder="Enter stock quantity"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    placeholder="Describe the product"
                ></textarea>

                <button type="submit" id="saveButton">
                    Save Product
                </button>

                <button
                    type="button"
                    id="cancelEdit"
                    class="cancel-button"
                    hidden
                >
                    Cancel Edit
                </button>

            </form>
        </section>

        <!-- STATUS MESSAGE -->
        <p id="message" role="status" aria-live="polite"></p>

        <!-- PRODUCT LIST -->
        <section class="panel">
            <h2>Available Products</h2>

            <p>View and manage products stored in the database.</p>

            <button type="button" id="refreshBtn">
                Refresh Products
            </button>

            <div id="productList">
                Loading products...m
            </div>
        </section>

    </main>

    
    <footer>
        <p>Tech Product Showcase | ICT251 Activity 4</p>
    </footer>

</body>
</html>
