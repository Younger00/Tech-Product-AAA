<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Tech Product Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }
        .table-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            overflow-x: auto;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            height: 70px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        #responseMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

    <!-- Form Section -->
    <div class="container">
        <h2>Add a Product</h2>
        <form id="productForm">
            <label for="product_name">Product Name:</label>
            <input type="text" id="product_name" required placeholder="e.g. Speaker">

            <label for="brand">Brand:</label>
            <input type="text" id="brand" required placeholder="e.g. JBL">

            <label for="category">Category:</label>
            <select id="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Audio">Audio</option>
                <option value="Laptops">Laptops</option>
                <option value="Smartphones">Smartphones</option>
                <option value="Accessories">Accessories</option>
                <option value="Gaming">Gaming</option>
            </select>

            <label for="price">Price ($):</label>
            <input type="number" step="0.01" id="price" required placeholder="e.g. 4500">

            <label for="stock_quantity">Stock Quantity:</label>
            <input type="number" id="stock_quantity" required placeholder="e.g. 4">

            <label for="description">Description:</label>
            <textarea id="description" placeholder="e.g. Clean Bluetooth speaker"></textarea>

            <button type="submit">Add Product</button>
        </form>

        <p id="responseMessage"></p>
    </div>

    <!-- Live Product List Table Section -->
    <div class="table-container">
        <h2>Product Inventory</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Brand</th>
                    <th>Category</th>
                    <th>Price ($)</th>
                    <th>Stock</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <tr>
                    <td colspan="7" style="text-align:center;">Loading products...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('productForm');
        const msgElement = document.getElementById('responseMessage');
        const tableBody = document.getElementById('productTableBody');
        const apiUrl = '/products';

        // Function to load and display products in the table
        async function fetchProducts() {
            try {
                const response = await fetch(apiUrl);
                const products = await response.json();

                if (products.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No products found in database.</td></tr>';
                    return;
                }

                tableBody.innerHTML = '';
                products.forEach(p => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${p.id}</td>
                        <td><strong>${p.product_name}</strong></td>
                        <td>${p.brand}</td>
                        <td>${p.category}</td>
                        <td>$${parseFloat(p.price).toFixed(2)}</td>
                        <td>${p.stock_quantity}</td>
                        <td>${p.description || '-'}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Error loading products: ${err.message}</td></tr>`;
            }
        }

        // Fetch products when page loads
        fetchProducts();

        // Submit form handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const productData = {
                product_name: document.getElementById('product_name').value,
                brand: document.getElementById('brand').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                stock_quantity: parseInt(document.getElementById('stock_quantity').value),
                description: document.getElementById('description').value
            };

            msgElement.style.color = '#555';
            msgElement.innerText = 'Submitting...';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });

                const result = await response.json();

                if (response.ok) {
                    msgElement.style.color = 'green';
                    msgElement.innerText = 'Success! Product added to live database.';
                    form.reset();
                    // Instantly refresh table with the new product!
                    fetchProducts();
                } else {
                    msgElement.style.color = 'red';
                    msgElement.innerText = 'Error: ' + (result.error || JSON.stringify(result));
                }
            } catch (err) {
                msgElement.style.color = 'red';
                msgElement.innerText = 'Network error: ' + err.message;
            }
        });
    </script>
</body>
</html>
