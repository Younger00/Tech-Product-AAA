<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Product Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }
        .table-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            overflow-x: auto;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            height: 70px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        #formTitle {
            color: #007bff;
        }
        #cancelEditBtn {
            background-color: #6c757d;
            margin-top: 10px;
            display: none;
        }
        #cancelEditBtn:hover {
            background-color: #5a6268;
        }
        #responseMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .action-btns button {
            padding: 6px 10px;
            font-size: 12px;
            margin-right: 5px;
            width: auto;
            margin-top: 0;
        }
        .edit-btn {
            background-color: #ffc107;
            color: #333;
        }
        .edit-btn:hover {
            background-color: #e0a800;
        }
        .delete-btn {
            background-color: #dc3545;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <!-- Form Section -->
    <div class="container">
        <h2 id="formTitle">Add a Product</h2>
        <form id="productForm">
            <input type="hidden" id="productId">

            <label for="product_name">Product Name:</label>
            <input type="text" id="product_name" required placeholder="e.g. Speaker">

            <label for="brand">Brand:</label>
            <input type="text" id="brand" required placeholder="e.g. JBL">

            <label for="category">Category:</label>
            <select id="category" required>
                <option value="" disabled selected>Select a category</option>
                <option value="Computers">Computers</option>
                <option value="Phones">Phones</option>
                <option value="Audio">Audio</option>
                <option value="Accessories">Accessories</option>
                <option value="Displays">Displays</option>
                <option value="Tablets">Tablets</option>
                <option value="Printers">Printers</option>
            </select>

            <label for="price">Price ($):</label>
            <input type="number" step="0.01" id="price" required placeholder="e.g. 4500">

            <label for="stock_quantity">Stock Quantity:</label>
            <input type="number" id="stock_quantity" required placeholder="e.g. 4">

            <label for="description">Description:</label>
            <textarea id="description" placeholder="e.g. Clean Bluetooth speaker"></textarea>

            <button type="submit" id="submitBtn">Add Product</button>
            <button type="button" id="cancelEditBtn" onclick="resetForm()">Cancel Edit</button>
        </form>

        <p id="responseMessage"></p>
    </div>

    <!-- Live Product List Table Section -->
    <div class="table-container">
        <h2>Product Inventory</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Brand</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <tr>
                    <td colspan="8" style="text-align:center;">Loading products...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('productForm');
        const msgElement = document.getElementById('responseMessage');
        const tableBody = document.getElementById('productTableBody');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const apiUrl = '/products';

        let isEditing = false;

        // Fetch and display all products
        async function fetchProducts() {
            try {
                const response = await fetch(apiUrl);
                const products = await response.json();

                if (products.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No products found in database.</td></tr>';
                    return;
                }

                tableBody.innerHTML = '';
                products.forEach(p => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${p.id}</td>
                        <td><strong>${p.product_name}</strong></td>
                        <td>${p.brand}</td>
                        <td>${p.category}</td>
                        <td>$${parseFloat(p.price).toFixed(2)}</td>
                        <td>${p.stock_quantity}</td>
                        <td>${p.description || '-'}</td>
                        <td class="action-btns">
                            <button class="edit-btn" onclick="editProduct(${p.id}, '${p.product_name}', '${p.brand}', '${p.category}', ${p.price}, ${p.stock_quantity}, '${p.description || ''}')">Edit</button>
                            <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:red;">Error loading products: ${err.message}</td></tr>`;
            }
        }

        fetchProducts();

        // Handle form submit (Add or Update)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('productId').value;
            const productData = {
                product_name: document.getElementById('product_name').value,
                brand: document.getElementById('brand').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                stock_quantity: parseInt(document.getElementById('stock_quantity').value),
                description: document.getElementById('description').value
            };

            msgElement.style.color = '#555';
            msgElement.innerText = isEditing ? 'Updating product...' : 'Submitting...';

            try {
                let response;
                if (isEditing) {
                    response = await fetch(`${apiUrl}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(productData)
                    });
                } else {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(productData)
                    });
                }

                const result = await response.json();

                if (response.ok) {
                    msgElement.style.color = 'green';
                    msgElement.innerText = isEditing ? 'Success! Product updated.' : 'Success! Product added.';
                    resetForm();
                    fetchProducts();
                } else {
                    msgElement.style.color = 'red';
                    msgElement.innerText = 'Error: ' + (result.error || JSON.stringify(result));
                }
            } catch (err) {
                msgElement.style.color = 'red';
                msgElement.innerText = 'Network error: ' + err.message;
            }
        });

        // Load product details into form for editing
        function editProduct(id, name, brand, category, price, stock, description) {
            isEditing = true;
            document.getElementById('productId').value = id;
            document.getElementById('product_name').value = name;
            document.getElementById('brand').value = brand;
            document.getElementById('category').value = category;
            document.getElementById('price').value = price;
            document.getElementById('stock_quantity').value = stock;
            document.getElementById('description').value = description === 'null' ? '' : description;

            formTitle.innerText = `Edit Product (ID: ${id})`;
            submitBtn.innerText = 'Update Product';
            cancelEditBtn.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete product by ID
        async function deleteProduct(id) {
            if (!confirm(`Are you sure you want to delete product ID ${id}?`)) return;

            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    msgElement.style.color = 'green';
                    msgElement.innerText = `Product ID ${id} deleted successfully.`;
                    fetchProducts();
                } else {
                    const result = await response.json();
                    alert('Error deleting product: ' + result.error);
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        }

        // Reset form back to 'Add' mode
        function resetForm() {
            isEditing = false;
            form.reset();
            document.getElementById('productId').value = '';
            formTitle.innerText = 'Add a Product';
            submitBtn.innerText = 'Add Product';
            cancelEditBtn.style.display = 'none';
            msgElement.innerText = '';
        }
    </script>
</body>
</html>
